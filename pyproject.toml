[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "little-tts"
version = "0.4.0"
description = "A 4.65M-parameter English DDSP TTS trained on real human speech"
readme = "README.md"
authors = [{ name = "TuringLogic" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.24,<3", "soundfile>=0.12,<1"]

[project.optional-dependencies]
# The "own" front end: text to phonemes without eSpeak.
own = ["dizione @ git+https://github.com/n4ze3m/dizione@8cd889e4de7be6bd1dd2e6891344a0729fa14dd4"]
prepare = ["librosa>=0.10.2,<1", "pyarrow>=15", "huggingface-hub>=0.34,<2", "soxr>=0.3,<2"]
# Annotation only: the pretrained phoneme recogniser used for forced alignment.
annotate = ["transformers>=4.40,<5", "torchaudio>=2.1,<3", "scipy>=1.10,<2", "huggingface-hub>=0.34,<2"]
# Evaluation only: ASR scoring and comparison with recordings.
evaluate = ["faster-whisper>=1.0,<2", "jiwer>=3,<5", "librosa>=0.10.2,<1", "scipy>=1.10,<2"]

[project.scripts]
little-tts-prepare = "little_tts.prepare:main"
little-tts-annotate = "little_tts.annotate:main"
little-tts-train = "little_tts.train:main"
little-tts-evaluate = "little_tts.evaluate:main"
little-tts-speak = "little_tts.infer:main"
little-tts-inspect = "little_tts.inspect:main"

[tool.setuptools.packages.find]
where = ["src"]
